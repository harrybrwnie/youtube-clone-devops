---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-clone-deployment
  labels:
    app: youtube-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtube-clone
  template:
    metadata:
      labels:
        app: youtube-clone
    spec:
      containers:
      - name: youtube-clone-container
        image: h4rrybrwnie/youtube-clone:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: youtube-clone-service
spec:
  type: LoadBalancer
  selector:
    app: youtube-clone
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
